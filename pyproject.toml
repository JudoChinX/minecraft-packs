[project]
name = "minecraft-packs"
version = "0.2.0"
description = "Reproducible Minecraft Java resource packs, built from official assets at build time"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pillow==12.3.0",
]

[tool.ruff]
line-length = 120
preview = true
# The style guide's "Don't" examples break the rules on purpose.
extend-exclude = ["docs/style-guide.md"]

[tool.ruff.lint]
select = ["I", "E", "W", "D"]
ignore = ["E402", "E501", "E722", "D102", "D105"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.pylint.master]
jobs = 0

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "duplicate-code",
    "arguments-differ",
    "import-outside-toplevel",
    "too-few-public-methods",
    "logging-fstring-interpolation",
    "protected-access",
    "redefined-outer-name",
]

[tool.pylint.design]
max-returns = 2
max-args = 10
max-positional-arguments = 10
max-attributes = 16
max-locals = 20
max-module-lines = 1200
max-parents = 8

[tool.mypy]
disallow_untyped_defs = true
# Disable all other checks as per "Only enabled check: disallow_untyped_defs"
disable_error_code = [
    "attr-defined",
    "name-defined",
    "arg-type",
    "index",
    "import-untyped",
    "operator",
    "valid-type",
    "var-annotated",
    "misc",
    "no-any-return",
    "assignment",
    "union-attr",
    "call-arg",
    "type-var",
    "import",
    "no-untyped-call",
    "list-item",
    "dict-item",
]
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_return_any = true
warn_no_return = false
strict_optional = true
follow_imports = "skip"
incremental = false
exclude = [
    "__pycache__",
    "build",
    "dist",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=minecraft_packs --cov-report=term-missing --cov-fail-under=95 -n auto"
filterwarnings = [
    "error",
]
