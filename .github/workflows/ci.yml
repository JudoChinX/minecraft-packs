name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; pushes to main and release tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests_and_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pylint
        run: pylint minecraft_packs/ tests/

      - name: mypy
        run: mypy minecraft_packs/ tests/

      - name: bandit
        run: bandit -r minecraft_packs/ -lll

      - name: yamllint
        run: yamllint .

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: pytest
        run: pytest

  reproducible_build:
    runs-on: ubuntu-latest
    needs: tests_and_quality
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-hashes.txt

      - name: Build every pack twice, each checked against its expected.sha1
        run: |
          python -m minecraft_packs build --check --out-dir dist-first
          python -m minecraft_packs build --check --out-dir dist-second

      - name: Fail unless both builds are byte-identical
        run: |
          ls dist-first/*.zip
          cat dist-first/*.sha1
          diff -r dist-first dist-second

      - name: Verify the zips
        run: python -m minecraft_packs verify dist-first/*.zip

  release:
    needs: [tests_and_quality, reproducible_build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-hashes.txt

      - name: Check the tag is on main and matches the package version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; release only from main."
            exit 1
          fi
          VERSION="$(python -c 'import minecraft_packs; print(minecraft_packs.__version__)')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version v$VERSION."
            exit 1
          fi

      - name: Build and verify every pack
        run: |
          python -m minecraft_packs build --check --out-dir dist
          python -m minecraft_packs verify dist/*.zip

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha1 \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
