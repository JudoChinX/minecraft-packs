# The Paradox Rift (Daxton, minecraft/ideas#41): a data-pack dimension, paradox:rift, for a Paper server.
#
# Everything is under files/data/paradox/. The build only checks it (paths, JSON) and zips it.
# ORE_STATES (beside this file, not in the zip) lists the four mushroom-block states the ore features place.

[pack]
kind = "data"
description = "The Paradox Rift - a dimension of red moss, rifts and the Primary Cave"
# Minecraft 26.3 is data pack format 121 (as the Sift).
min_format = 121
max_format = 121
