# Mobs: every custom mob look on the server, as the one resource pack a server can send.
#
# The pack is files/ alone: no vanilla texture is recoloured, so the build downloads nothing for it. files/ holds the
# custom mobs as BetterModel display models (assets/bettermodel/, generated by BetterModel 3.5.0 from Blockbench
# models that are this project's own work): the Sift mobs (the Blob, the Sifter, the Harmonizer and the Twisted
# Harmonizer), the eight soul-corrupted mobs, the Sculk Sniffer, the Jellyfish, the Tropical Fish Slime, the Tuff
# Golem, the Bear, the Piston Golem, the Enchanter, the Summoner, the Arch-Illager, the Hopping Pig, the five pirates,
# the Pirate Captain, the Geomancer, the Infernoillager and the Simphtomer; nine item models (assets/mobs/): Jello, the
# Harmonizer Tentacle, the Cooked Harmonizer Tentacle, the Tropical Slime, the Orb of Dominance, the Ancient Callings,
# the Cutlass, the Peg Leg and the Moldy Oak Planks (a block model, assets/mobs/models/block/); the items atlas
# (assets/minecraft/atlases/items.json), which gives the illagers' and the pirates' heads the client's own pillager
# texture and the Hopping Pig the client's own pig texture by name, so the pack ships no Mojang pixels; the mushroom
# stem's blockstate (assets/minecraft/blockstates/mushroom_stem.json), vanilla's multipart naming vanilla's own models,
# with its all-faces-off state drawn as the Moldy Oak Planks; and pack.png, a front view of the Enchanter model's head
# and hat drawn from that model and its texture. The Illusioner recolour that drew the Enchanter until 0.5.0 is gone; it
# lives on, unchanged, in the separate enchanter pack.

[pack]
description = "Mobs — the Enchanter and Daxton's mobs"
# Minecraft 26.3 is resource pack format 97.1 (the client jar's version.json "pack_version").
# Since 25w31a packs declare min_format/max_format; pack_format is only required for packs that
# also claim formats below 65. An integer max_format covers every minor version of that major.
min_format = 97
max_format = 97
